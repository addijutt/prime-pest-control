<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Before / After post</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  /* Post sizes: ?w=1080&h=1350 (feed), 1080x1080 (square), 1080x1920 (story) */
  :root {
    --ink: #0E1A35;
    --ink-2: #1a1d20;
    --emerald: #16A34A;
    --emerald-deep: #16A34A;
    --mint: #c9f3d8;
    --paper: #f4f2ee;
    --muted: #9aa3a0;
    --yellow: #f5e50a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  body { font-family: 'Manrope', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .post {
    position: relative; overflow: hidden;
    width: var(--w); height: var(--h);
    padding: 64px 64px 56px;
    display: flex; flex-direction: column;
    background:
      radial-gradient(900px 600px at 110% -10%, rgba(22,163,74,.22), transparent 60%),
      radial-gradient(700px 500px at -20% 110%, rgba(22,163,74,.12), transparent 60%),
      var(--ink);
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { height: 64px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--mint); padding: 12px 18px; border-radius: 999px;
    border: 1px solid rgba(201,243,216,.28); background: rgba(255,255,255,.04);
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 0 4px rgba(22,163,74,.25); }
  h1 { margin-top: 56px; font-weight: 800; font-size: 100px; line-height: 1.04; letter-spacing: -.04em; }
  h1 em { font-style: normal; color: var(--emerald); }
  .sub { margin-top: 22px; font-size: 28px; line-height: 1.35; color: #c7cdca; font-weight: 500; max-width: 820px; }
  /* Two panels side by side, both cropped to the same spot (--focus) so the change is easy to see */
  .compare {
    position: relative; margin-top: 44px; flex: 1; min-height: 0;
    display: grid; grid-template-columns: 1fr 1fr; gap: 14px;
  }
  .panel {
    position: relative; border-radius: 30px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  .panel img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus, 72% 50%); }
  .arrow {
    position: absolute; z-index: 3; top: 50%; left: 50%; transform: translate(-50%, -50%);
    width: 64px; height: 64px; border-radius: 50%; background: #fff; display: grid; place-items: center;
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
  }
  .arrow svg { width: 32px; height: 32px; }
  .tag { z-index: 3;
    position: absolute; top: 22px; padding: 12px 20px; border-radius: 999px;
    font-size: 19px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase;
    backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  }
  .tag.before { left: 22px; background: rgba(14,26,53,.6); color: #fff; border: 1px solid rgba(255,255,255,.18); }
  .tag.after { left: 22px; background: #16A34A; color: #fff; backdrop-filter: none; -webkit-backdrop-filter: none; }
  /* Square: smaller headline, no subline, so the photos get the space */
  .square h1 { margin-top: 40px; font-size: 84px; }
  .square .sub { display: none; }
  .square .compare { margin-top: 32px; }
  .square .points { margin-top: 22px; }
  .square .point { padding: 14px 18px; font-size: 19px; }
  .square .cta { margin-top: 22px; }
  .points { display: flex; gap: 14px; margin-top: 30px; }
  .point {
    flex: 1; display: flex; align-items: center; gap: 14px;
    padding: 18px 20px; border-radius: 22px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    font-size: 21px; font-weight: 600; line-height: 1.2; color: #e8ecea;
  }
  .point svg { flex: none; width: 34px; height: 34px; }
  .cta { display: flex; align-items: center; justify-content: space-between; margin-top: 30px; gap: 24px; }
  .terms { font-size: 21px; color: var(--muted); font-weight: 600; line-height: 1.4; }
  .terms b { color: #fff; font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; gap: 14px; flex: none;
    padding: 22px 34px; border-radius: 999px; background: var(--emerald);
    font-size: 30px; font-weight: 800; letter-spacing: -.01em; color: #fff;
    box-shadow: 0 14px 34px rgba(22,163,74,.35);
  }
  .btn svg { width: 34px; height: 34px; }
  /* Four chips in a 2 x 2 grid */
  .points { display: grid; grid-template-columns: 1fr 1fr; }
  .square .points { grid-template-columns: 1fr 1fr; gap: 10px; }
  .square .point { padding: 11px 16px; font-size: 18px; }
  .square .point svg { width: 28px; height: 28px; }
  /* Story: keep logo, text and button inside the safe zone (Instagram covers ~250 px top, ~340 px bottom) */
  .story { padding-top: 250px; padding-bottom: 360px; }
  .story h1 { margin-top: 40px; }
  .story .sub { display: none; }
  .story .compare { margin-top: 40px; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="top">
    <img src="assets/logo-on-dark.png" alt="Prime Pest Control">
    <span class="badge"><i></i>Dubai Municipality Approved</span>
  </div>

  <h1 id="headline">Stop pigeons.<br><em>Keep your view.</em></h1>
  <p class="sub" id="sub">We clean and disinfect the balcony, then fit a near-invisible net from ceiling to railing.</p>

  <div class="compare">
    <div class="panel"><img id="imgBefore" src="assets/pigeon-before.png" alt="Before"><span class="tag before">Before</span></div>
    <div class="panel"><img id="imgAfter" src="assets/pigeon-after.png" alt="After"><span class="tag after">After</span></div>
    <div class="arrow"><svg viewBox="0 0 24 24" fill="none" stroke="#0E1A35" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg></div>
  </div>

  <div class="points" id="points"></div>

  <div class="cta">
    <p class="terms" id="terms"><b>Free survey</b><br>Open 24/7 · All Dubai</p>
    <span class="btn"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.8 11.9 11.9 0 004.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>055 304 5256</span>
  </div>
</div>
<script>
  // Size from the URL: before-after.html?w=1080&h=1350
  const q = new URLSearchParams(location.search);
  const w = +(q.get('w') || 1080), h = +(q.get('h') || 1350);
  const post = document.getElementById('post');
  post.style.setProperty('--w', w + 'px');
  post.style.setProperty('--h', h + 'px');
  if (h <= 1100) { post.classList.add('square'); }
  if (h >= 1800) { post.classList.add('story'); }

  // Hook variants to test: ?v=1|2|3   Price line: ?price=1
  const HOOKS = {
    1: { h: 'Stop pigeons.<br><em>Keep your view.</em>', size: 100 },
    2: { h: 'Pigeons on the balcony?<br><em>Gone in one visit.</em>', size: 80 },
    3: { h: 'Your balcony back.<br><em>Your view kept.</em>', size: 92 },
  };
  const hook = HOOKS[q.get('v') || 1] || HOOKS[1];
  const h1 = document.getElementById('headline');
  h1.innerHTML = hook.h;
  if (!post.classList.contains('square')) h1.style.fontSize = hook.size + 'px';
  else h1.style.fontSize = Math.round(hook.size * 0.84) + 'px';

  const CHIPS = ['Near-invisible net', 'Long-term guarantee', 'Humane, no harm to birds', 'Net colour your building allows'];
  const tick = '<svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  document.getElementById('points').innerHTML = CHIPS.map((c) => `<div class="point">${tick}${c}</div>`).join('');

  if (q.get('price') === '1') {
    document.getElementById('terms').innerHTML = '<b>From AED 8 / sq ft</b><br>Free survey · Open 24/7';
  }
</script>
</body>
</html>
