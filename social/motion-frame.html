<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Motion frame</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  /* Full-screen frame for the motion ad: ?stage=before|after&w=1080&h=1920 */
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: #0E1A35; }
  body { font-family: 'Manrope', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .frame { position: relative; overflow: hidden; width: var(--w); height: var(--h); }
  .frame > img.bg { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 70% 50%; }
  .shade { position: absolute; inset: 0; background:
    linear-gradient(180deg, rgba(14,26,53,.82) 0%, rgba(14,26,53,.35) 30%, rgba(14,26,53,0) 48%, rgba(14,26,53,0) 62%, rgba(14,26,53,.85) 100%); }
  .inner { position: absolute; inset: 0; padding: var(--pt) 64px var(--pb); display: flex; flex-direction: column; }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { height: 64px; }
  .badge { font-size: 17px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: #c9f3d8;
    padding: 12px 18px; border-radius: 999px; border: 1px solid rgba(201,243,216,.3); background: rgba(14,26,53,.45); }
  h1 { margin-top: 44px; font-weight: 800; font-size: 96px; line-height: 1.04; letter-spacing: -.04em; text-shadow: 0 4px 30px rgba(0,0,0,.35); }
  h1 em { font-style: normal; color: #22C55E; }
  .tag { align-self: flex-start; margin-top: 26px; padding: 12px 22px; border-radius: 999px; font-size: 22px; font-weight: 800;
    letter-spacing: .16em; text-transform: uppercase; }
  .tag.before { background: rgba(14,26,53,.6); border: 1px solid rgba(255,255,255,.25); }
  .tag.after { background: #16A34A; }
  .bottom { margin-top: auto; display: flex; flex-wrap: wrap; gap: 12px; }
  .bottom span { padding: 14px 20px; border-radius: 999px; font-size: 24px; font-weight: 700;
    background: rgba(14,26,53,.55); border: 1px solid rgba(255,255,255,.2); }
  .bottom span b { color: #22C55E; }
</style>
</head>
<body>
<div class="frame" id="frame">
  <img class="bg" id="bg" alt="">
  <div class="shade"></div>
  <div class="inner">
    <div class="top"><img src="assets/logo-on-dark.png" alt="Prime Pest Control"><span class="badge">Dubai Municipality Approved</span></div>
    <h1 id="h1"></h1>
    <span class="tag" id="tag"></span>
    <div class="bottom" id="bottom"></div>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const w = +(q.get('w') || 1080), h = +(q.get('h') || 1920);
  const f = document.getElementById('frame');
  f.style.setProperty('--w', w + 'px'); f.style.setProperty('--h', h + 'px');
  const story = h >= 1800;
  f.style.setProperty('--pt', story ? '250px' : '64px');
  f.style.setProperty('--pb', story ? '360px' : '56px');
  const after = q.get('stage') === 'after';
  document.getElementById('bg').src = after ? 'assets/pigeon-after.png' : 'assets/pigeon-before.png';
  document.getElementById('h1').innerHTML = after ? 'Netted, cleaned,<br><em>view kept.</em>' : 'Pigeons on<br>the balcony?';
  const tag = document.getElementById('tag');
  tag.textContent = after ? 'After' : 'Before';
  tag.className = 'tag ' + (after ? 'after' : 'before');
  document.getElementById('bottom').innerHTML = after
    ? '<span><b>✓</b> Near-invisible net</span><span><b>✓</b> Long-term guarantee</span>'
    : '<span>Droppings on the rail</span><span>Back every morning</span>';
</script>
</body>
</html>
