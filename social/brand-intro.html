<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Brand intro post</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&display=block" rel="stylesheet">
<style>
  /* Sizes by URL: ?w=1080&h=1350 (feed), 1080x1080 (square), 1080x1920 (story) */
  :root { --ink: #0E1A35; --emerald: #16A34A; --mint: #c9f3d8; --muted: #9aa3a0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { background: var(--ink); }
  body { font-family: 'Manrope', sans-serif; color: #fff; -webkit-font-smoothing: antialiased; }
  .post {
    position: relative; overflow: hidden; width: var(--w); height: var(--h);
    padding: 64px 64px 56px; display: flex; flex-direction: column;
    background:
      radial-gradient(900px 600px at 110% -10%, rgba(22,163,74,.22), transparent 60%),
      radial-gradient(700px 500px at -20% 110%, rgba(22,163,74,.12), transparent 60%),
      var(--ink);
  }
  .top { display: flex; align-items: center; justify-content: space-between; }
  .top img { height: 64px; }
  .badge {
    display: inline-flex; align-items: center; gap: 10px;
    font-size: 17px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase;
    color: var(--mint); padding: 12px 18px; border-radius: 999px;
    border: 1px solid rgba(201,243,216,.28); background: rgba(255,255,255,.04);
  }
  .badge i { width: 8px; height: 8px; border-radius: 50%; background: var(--emerald); box-shadow: 0 0 0 4px rgba(22,163,74,.25); }
  h1 { margin-top: 52px; font-weight: 800; font-size: 96px; line-height: 1.04; letter-spacing: -.04em; }
  h1 em { font-style: normal; color: var(--emerald); }
  .sub { margin-top: 22px; font-size: 28px; line-height: 1.35; color: #c7cdca; font-weight: 500; max-width: 900px; }
  .photo {
    position: relative; margin-top: 40px; flex: 1; min-height: 0; border-radius: 30px; overflow: hidden;
    box-shadow: 0 30px 80px rgba(0,0,0,.55), 0 0 0 1px rgba(255,255,255,.06);
  }
  .photo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: var(--focus, 50% 50%); }
  .photo::after { content: ''; position: absolute; inset: 0; background: linear-gradient(180deg, transparent 55%, rgba(14,26,53,.75)); }
  .services {
    position: absolute; left: 24px; right: 24px; bottom: 22px; z-index: 2;
    display: flex; flex-wrap: wrap; gap: 10px;
  }
  .services span {
    padding: 10px 16px; border-radius: 999px; font-size: 19px; font-weight: 700;
    background: rgba(14,26,53,.55); border: 1px solid rgba(255,255,255,.18);
    backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
  }
  .points { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 28px; }
  .point {
    display: flex; align-items: center; gap: 14px; padding: 18px 20px; border-radius: 22px;
    background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08);
    font-size: 21px; font-weight: 600; line-height: 1.2; color: #e8ecea;
  }
  .point svg { flex: none; width: 34px; height: 34px; }
  .cta { display: flex; align-items: center; justify-content: space-between; margin-top: 28px; gap: 24px; }
  .terms { font-size: 21px; color: var(--muted); font-weight: 600; line-height: 1.4; }
  .terms b { color: #fff; font-weight: 700; }
  .btn {
    display: inline-flex; align-items: center; gap: 14px; flex: none; padding: 22px 34px; border-radius: 999px;
    background: var(--emerald); font-size: 30px; font-weight: 800; color: #fff; box-shadow: 0 14px 34px rgba(22,163,74,.35);
  }
  .btn svg { width: 34px; height: 34px; }
  .square h1 { margin-top: 36px; font-size: 76px; }
  .square .sub { display: none; }
  .square .photo { margin-top: 28px; }
  .square .points { margin-top: 20px; gap: 10px; }
  .square .point { padding: 11px 16px; font-size: 18px; }
  .square .point svg { width: 28px; height: 28px; }
  .square .cta { margin-top: 20px; }
  .story { padding-top: 250px; padding-bottom: 360px; }
  .story h1 { margin-top: 40px; }
</style>
</head>
<body>
<div class="post" id="post">
  <div class="top">
    <img src="assets/logo-on-dark.png" alt="Prime Pest Control">
    <span class="badge"><i></i>Dubai Municipality Approved</span>
  </div>
  <h1>Pest and bird control<br><em>across Dubai.</em></h1>
  <p class="sub">Apartments, villas, hotels and restaurants. Send a photo on WhatsApp, get a clear price, and we're on our way.</p>
  <div class="photo">
    <img src="assets/intro-photo.webp" alt="Technician treating under a kitchen sink in a Dubai apartment">
    <div class="services"><span>Cockroaches</span><span>Bed bugs</span><span>Termites</span><span>Rodents</span><span>Pigeons</span></div>
  </div>
  <div class="points" id="points"></div>
  <div class="cta">
    <p class="terms"><b>Free quote on WhatsApp</b><br>All Dubai communities</p>
    <span class="btn"><svg viewBox="0 0 24 24" fill="#fff"><path d="M12 2a10 10 0 00-8.6 15.1L2 22l5-1.3A10 10 0 1012 2zm0 18.2c-1.6 0-3.1-.4-4.4-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1112 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 01-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 00-.7.3 3 3 0 00-.9 2.2 5.2 5.2 0 001.1 2.8 11.9 11.9 0 004.6 4c1.7.7 2.4.8 3.2.7.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.2-1.2-.1-.1-.3-.2-.5-.3z"/></svg>055 304 5256</span>
  </div>
</div>
<script>
  const q = new URLSearchParams(location.search);
  const w = +(q.get('w') || 1080), h = +(q.get('h') || 1350);
  const post = document.getElementById('post');
  post.style.setProperty('--w', w + 'px');
  post.style.setProperty('--h', h + 'px');
  if (h <= 1100) post.classList.add('square');
  if (h >= 1800) post.classList.add('story');
  const CHIPS = ['Open 24/7, every day', 'Same-day visits', 'Safe for kids and pets', 'Clear price before we start'];
  const tick = '<svg viewBox="0 0 24 24" fill="none" stroke="#16A34A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M7.5 12.5l3 3 6-6.5"/></svg>';
  document.getElementById('points').innerHTML = CHIPS.map((c) => `<div class="point">${tick}${c}</div>`).join('');
</script>
</body>
</html>
